// Tier 1: exhaustive data from a Passive Seismic Experiment on the home world.
// Exhaustive results need the instrument fully calibrated, and calibration
// depends on the kerbal: f = 1 + 0.25 * (level + trait - complexity), Scientist
// +1 / Pilot 0 / Engineer -1; Exhaustive needs f > 0.75, i.e. level + trait >=
// complexity. The PSE has complexity 1, so any scientist qualifies - the only
// SEP instrument (with the IHP) a level-0 roster can push to Exhaustive.

CONTRACT_TYPE
{
	name = SEP_T1_ExhaustivePSE
	group = SEPContracts

	title = Exhaustive seismic survey of @/pseBiome.Name()
	genericTitle = Exhaustive seismic survey on @targetBody.DisplayName()
	description = The basic seismic readings were promising, but the AKI geophysics team wants the full data set. Send a scientist to @/pseBiome.Name() with a Central Station and a Passive Seismic Experiment, calibrate it properly, let it run to Exhaustive and bring the results home.
	genericDescription = Set up a Passive Seismic Experiment on @targetBody.DisplayName(), run it to Exhaustive and bring the results home.
	synopsis = Return or transmit Exhaustive Passive Seismic Experiment data from @/pseBiome.Name().
	completedMessage = Exhaustive seismic data from @/pseBiome.Name() received. The geophysics team is already arguing about what it means.

	agent = Albert Kermin Industries
	targetBody = HomeWorld()
	prestige = Significant

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 5.0
	rewardReputation = 6.0
	rewardFunds = 22000.0
	advanceFunds = 7000.0
	failureReputation = 3.0
	failureFunds = 7000.0

	DATA
	{
		type = Biome
		pseBiome = @targetBody.Biomes().Where(b => !b.IsKSC() && b.Name() != "Water").Random()
		uniquenessCheck = CONTRACT_ALL
		title = Target biome
	}

	REQUIREMENT
	{
		name = FirstStation
		type = CompleteContract
		contractType = SEP_T0_FieldStation
		minCount = 1
	}
	REQUIREMENT
	{
		name = HavePSE
		type = PartUnlocked
		part = SEP_PSE
	}
	// Someone who can calibrate a complexity-1 instrument to Exhaustive.
	REQUIREMENT
	{
		name = HaveScientist
		type = Expression
		expression = AllKerbals().Where(k => k.ExperienceTrait() == "Scientist").Count() > 0
		title = Have a scientist on the roster
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Set up a SEP station with a Passive Seismic Experiment in @/pseBiome.Name()

		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Has a SEP Central Station
		}
		PARAMETER
		{
			name = HasPSE
			type = PartValidation
			part = SEP_PSE
			minCount = 1
			title = Has a Passive Seismic Experiment linked to it
		}
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED
			biome = @/pseBiome
			title = Landed in @/pseBiome.Name()
		}
	}

	PARAMETER
	{
		name = Data
		type = CollectScience
		experiment = SEP_PSE_Exhaustive
		biome = @/pseBiome
		situation = SrfLanded
		recoveryMethod = RecoverOrTransmit
		title = Return or transmit Exhaustive Passive Seismic Experiment data from @/pseBiome.Name()
	}
}
