// Tier 0: a SEP field station in a biome of the home world, delivered by plane
// or rover. Repeatable, one contract per biome (uniquenessCheck), only offered
// while at least one SEP experiment is unlocked for the home world.
//
// The contract is about building the station, not about the science: a SEP
// instrument takes 75-100 days to run (experimentTime in the part cfgs), so
// asking for the data here would leave the contract hanging for weeks of game
// time. The science is the player's own reward once the run finishes.
//
// How SEP works, for reference: a kerbal on EVA KIS-attaches the Central Station
// and the instruments to the ground, links each instrument to the station with a
// pair of AKI plugs (KAS), then calibrates and starts the experiment. With the
// KAS 1.x plug the linked instrument becomes part of the station's vessel, which
// is what the VesselParameterGroup below relies on.
//
// OnSite accepts FLYING as well as LANDED on purpose: a KIS ground-attached
// station is frozen ~10 cm above the terrain, so after a reload it never gets
// ground contact and KSP reports it as FLYING (the same quirk that greys out
// "Space Center" with "vessel is about to crash"). Radar altitude <= 3 m keeps
// the check honest.

CONTRACT_TYPE
{
	name = SEP_T0_FieldStation
	group = SEPContracts

	title = Deploy a SEP field station in @/stationBiome.Name()
	genericTitle = Deploy a SEP field station on @targetBody
	description = Albert Kermin Industries has a warehouse full of Surface Experiment Packages and a marketing department that just learned the phrase "field-tested". Before anyone straps one to a Mun lander, they would like the field to be somewhere with an atmosphere, a runway and a rescue helicopter. Fly (or drive, or roll downhill) a Central Station and at least one instrument to the @/stationBiome.Name() biome of @targetBody, let a kerbal set it all up on the ground and plug the instrument into the station. The data can take its time; the kerbal should not. Bill says the plugs "definitely link this time".
	genericDescription = Set up a SEP station with an instrument plugged in, in one of the biomes of @targetBody. Bringing the kerbal back is not part of the contract, but it is strongly encouraged.
	synopsis = Deploy a SEP Central Station with at least one instrument linked to it in @/stationBiome.Name().
	completedMessage = The @/stationBiome.Name() station is up and the instrument is talking to it. Marketing has already printed "field-tested" on everything, including the coffee mugs. The science will be along in a few weeks; the mugs will not.

	agent = Albert Kermin Industries
	targetBody = HomeWorld()
	prestige = Trivial

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 3.0
	rewardReputation = 4.0
	rewardFunds = 14000.0
	advanceFunds = 5000.0
	failureReputation = 2.0
	failureFunds = 5000.0

	// A landable biome that has not had a station yet. KSC mini-biomes and open
	// water are out (a ground-attached station cannot be "landed" on water).
	DATA
	{
		type = Biome
		stationBiome = @targetBody.Biomes().Where(b => !b.IsKSC() && b.Name() != "Water").Random()
		uniquenessCheck = CONTRACT_ALL
		title = Target biome
	}

	// The SEP experiments the player can actually run here: unlocked in the tech
	// tree and allowed in this body's atmosphere (or lack of it). Only used to
	// decide whether the contract is offered at all.
	DATA
	{
		type = List<ScienceExperiment>
		sepBasic = AvailableExperiments(@targetBody).Where(e => e.ID().StartsWith("SEP_") && e.ID().EndsWith("_Basic"))
		requiredValue = false
		hidden = true
	}

	REQUIREMENT
	{
		name = HaveStation
		type = PartUnlocked
		part = SEP_CentralStation
	}
	REQUIREMENT
	{
		name = HavePlug
		type = PartUnlocked
		part = SEP_plug
	}
	REQUIREMENT
	{
		name = HaveExperiment
		type = Expression
		expression = @/sepBasic.Count() > 0
		title = At least one SEP instrument usable on the home world
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Set up a SEP station in @/stationBiome.Name()

		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Has a SEP Central Station
		}
		PARAMETER
		{
			name = HasInstrument
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 1
			title = Has at least one SEP instrument linked to it
		}
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED, FLYING
			maxTerrainAltitude = 3
			biome = @/stationBiome
			title = On the ground in @/stationBiome.Name()
			hideChildren = true
		}
	}
}
