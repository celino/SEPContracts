	}

	DATA
	{
		type = Vessel
		station = AllVessels().Where(v => v.Parts().Contains(SEP_CentralStation)).Where(v => !v.IsOrbiting()).Where(v => HomeWorld().Children().Contains(v.CelestialBody())).Where(v => v.Parts().Where(p => @/sepInstruments.Contains(p)).Count() == 1).Random()
		uniquenessCheck = CONTRACT_ACTIVE
		title = Format("#sepc.U.data.station", [])
