// Upgrade contracts: go back to a station built for the previous tier and add
// one more instrument to it.
//   - SEP_U2_KerbinCampus: a home-world station with two instruments gets a third
//     (offered alongside tier 2, after tier 1 has been completed).
//   - SEP_U3_MoonSecond: a station on one of the home world's moons with one
//     instrument gets a second (offered after tier 2).
//   - SEP_U4_FarThird: a station anywhere beyond the home system with two
//     instruments gets a third (offered after either tier-3 contract).
//
// The contract picks an existing vessel: it has a SEP Central Station, is on the
// right body, is not in orbit, and has exactly the previous tier's number of SEP
// instruments (counted by part name, since CC can't look at part modules here).
// Each condition gets its own Where(): CC's parser mixes up '==' and '&&' in one
// lambda. The VesselParameterGroup then tracks that vessel by name. Stations frozen by
// KIS are often reported as FLYING, so "not orbiting" is used instead of landed.

CONTRACT_TYPE
{
	name = SEP_U2_KerbinCampus
	group = SEPContracts

	title = Format("#sepc.U2.title", [ @/station.VesselName(), @targetBody ])
	genericTitle = Format("#sepc.U2.genericTitle", [])
	description = Format("#sepc.U2.description", [ @/station.VesselName(), @targetBody ])
	genericDescription = Format("#sepc.U2.genericDescription", [])
	synopsis = Format("#sepc.U2.synopsis", [ @/station.VesselName(), @targetBody ])
	completedMessage = Format("#sepc.U2.completedMessage", [ @/station.VesselName(), @targetBody ])
	agent = Albert Kermin Industries
	targetBody = HomeWorld()
	prestige = Significant

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 4.0
	rewardReputation = 5.0
	rewardFunds = 16000.0
	advanceFunds = 5000.0
	failureReputation = 2.0
	failureFunds = 5000.0

	// The eight SEP instruments, as a list so the station filter below can count them
	// (a list literal inside the Where() lambda doesn't parse).
	DATA
	{
		type = List<AvailablePart>
		sepInstruments = [SEP_LRRR, SEP_IHP, SEP_CCIG, SEP_SWS, SEP_WME, SEP_PSE, SEP_MAG, SEP_GRAV]
		hidden = true
	}

	DATA
	{
		type = Vessel
		station = AllVessels().Where(v => v.Parts().Contains(SEP_CentralStation)).Where(v => !v.IsOrbiting()).Where(v => v.CelestialBody() == HomeWorld()).Where(v => v.Parts().Where(p => @/sepInstruments.Contains(p)).Count() == 2).Random()
		uniquenessCheck = CONTRACT_ACTIVE
		title = Format("#sepc.U.data.station", [])
	}

	REQUIREMENT
	{
		name = TwoInstruments
		type = CompleteContract
		contractType = SEP_T1_TwoInstruments
		minCount = 1
	}

	PARAMETER
	{
		name = Upgrade
		type = VesselParameterGroup
		vessel = @/station
		title = Format("#sepc.U.param.station", [ @/station.VesselName() ])
		PARAMETER
		{
			name = HasInstruments
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 3
			title = Format("#sepc.T4.param.hasInstruments", [])
			hideChildren = true
		}
	}
}

