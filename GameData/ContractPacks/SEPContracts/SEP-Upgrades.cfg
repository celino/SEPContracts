	targetBody = @/station.CelestialBody()
	prestige = Significant

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 6.0
	rewardReputation = 8.0
	rewardFunds = 28000.0
	advanceFunds = 8000.0
	failureReputation = 4.0
