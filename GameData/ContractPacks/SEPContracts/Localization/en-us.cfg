// SEPContracts: English strings.
// <<1>>, <<2>>: values passed by Format() in the contract cfgs (biome name, body name).

Localization
{
	en-us
	{
		#sepc.group.name = Surface Experiment Package

		// shared by T0 and T1
		#sepc.data.targetBiome = Target biome
		#sepc.param.hasStation = Has a SEP Central Station
		#sepc.param.onSite = On the ground in <<1>>

		// T0: field station
		#sepc.T0.title = Deploy a SEP field station in <<1>>
		#sepc.T0.genericTitle = Deploy a SEP field station on <<1>>
		#sepc.T0.description = Albert Kermin Industries has a warehouse full of Surface Experiment Packages and a marketing department that just learned the phrase "field-tested". Before anyone straps one to a Mun lander, they would like the field to be somewhere with an atmosphere, a runway and a rescue helicopter. Fly (or drive, or roll downhill) a Central Station and at least one instrument to the <<1>> biome of <<2>>, let a kerbal set it all up on the ground and plug the instrument into the station. The data can take its time; the kerbal should not. Bill says the plugs "definitely link this time".
		#sepc.T0.genericDescription = Set up a SEP station with an instrument plugged in, in one of the biomes of <<1>>. Bringing the kerbal back is not part of the contract, but it is strongly encouraged.
		#sepc.T0.synopsis = Deploy a SEP Central Station with at least one instrument linked to it in <<1>>.
		#sepc.T0.completedMessage = The <<1>> station is up and the instrument is talking to it. Marketing has already printed "field-tested" on everything, including the coffee mugs. The science will be along in a few weeks; the mugs will not.
		#sepc.T0.req.haveExperiment = At least one SEP instrument usable on the home world
		#sepc.T0.param.station = Set up a SEP station in <<1>>
		#sepc.T0.param.hasInstrument = Has at least one SEP instrument linked to it

		// T1: two instruments
		#sepc.T1.title = Expand the SEP station in <<1>> to two instruments
		#sepc.T1.genericTitle = A two-instrument SEP station on <<1>>
		#sepc.T1.description = One instrument on the ground is a science experiment. Two instruments plugged into the same Central Station is, according to the AKI brochure, a "research facility", and research facilities bill at a much better rate. Get a Central Station and two different SEP instruments into the <<1>> biome of <<2>>, set them up and plug both in. If there is already a station there, adding a second instrument to it is fine; the brochure does not say anything about the order.
		#sepc.T1.genericDescription = Set up a SEP station on <<1>> with two instruments plugged in. The brochure calls that a research facility.
		#sepc.T1.synopsis = Deploy a SEP Central Station with at least two instruments linked to it in <<1>>.
		#sepc.T1.completedMessage = Two instruments in <<1>>, both plugged in, both blinking. AKI has updated the brochure and the invoice. The data is due in a couple of months; the invoice is due now.
		#sepc.T1.req.haveTwoExperiments = At least two SEP instruments usable on the home world
		#sepc.T1.param.station = Set up a SEP station with two instruments in <<1>>
		#sepc.T1.param.hasInstruments = Has at least two SEP instruments linked to it
	}
}
