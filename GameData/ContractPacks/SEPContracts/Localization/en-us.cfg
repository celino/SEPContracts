// SEPContracts: English strings.
// <<1>>, <<2>>: values passed by Format() in the contract cfgs (biome name, body name).

Localization
{
	en-us
	{
		#sepc.group.name = Surface Experiment Package

		// shared by T0 and T1
		#sepc.data.targetBiome = Target biome
		#sepc.param.hasStation = Has a SEP Central Station
		#sepc.param.onSite = On the ground in <<1>>

		// T0: field station
		#sepc.T0.title = Deploy a SEP field station in <<1>>
		#sepc.T0.genericTitle = Deploy a SEP field station on <<1>>
		#sepc.T0.description = Albert Kermin Industries has a warehouse full of Surface Experiment Packages and a marketing department that just learned the phrase "field-tested". Before anyone straps one to a Mun lander, they would like the field to be somewhere with an atmosphere, a runway and a rescue helicopter. Fly (or drive, or roll downhill) a Central Station and at least one instrument to the <<1>> biome of <<2>>, let a kerbal set it all up on the ground and plug the instrument into the station. The data can take its time; the kerbal should not. Bill says the plugs "definitely link this time".
		#sepc.T0.genericDescription = Set up a SEP station with an instrument plugged in, in one of the biomes of <<1>>. Bringing the kerbal back is not part of the contract, but it is strongly encouraged.
		#sepc.T0.synopsis = Deploy a SEP Central Station with at least one instrument linked to it in <<1>>.
		#sepc.T0.completedMessage = The <<1>> station is up and the instrument is talking to it. Marketing has already printed "field-tested" on everything, including the coffee mugs. The science will be along in a few weeks; the mugs will not.
		#sepc.T0.req.haveExperiment = At least one SEP instrument usable on the home world
		#sepc.T0.param.station = Set up a SEP station in <<1>>
		#sepc.T0.param.hasInstrument = Has at least one SEP instrument linked to it

		// T1: two instruments
		#sepc.T1.title = Expand the SEP station in <<1>> to two instruments
		#sepc.T1.genericTitle = A two-instrument SEP station on <<1>>
		#sepc.T1.description = One instrument on the ground is a science experiment. Two instruments plugged into the same Central Station is, according to the AKI brochure, a "research facility", and research facilities bill at a much better rate. Get a Central Station and two different SEP instruments into the <<1>> biome of <<2>>, set them up and plug both in. If there is already a station there, adding a second instrument to it is fine; the brochure does not say anything about the order.
		#sepc.T1.genericDescription = Set up a SEP station on <<1>> with two instruments plugged in. The brochure calls that a research facility.
		#sepc.T1.synopsis = Deploy a SEP Central Station with at least two instruments linked to it in <<1>>.
		#sepc.T1.completedMessage = Two instruments in <<1>>, both plugged in, both blinking. AKI has updated the brochure and the invoice. The data is due in a couple of months; the invoice is due now.
		#sepc.T1.req.haveTwoExperiments = At least two SEP instruments usable on the home world
		#sepc.T1.param.station = Set up a SEP station with two instruments in <<1>>
		#sepc.T1.param.hasInstruments = Has at least two SEP instruments linked to it

		// shared by T3 and T4
		#sepc.param.hasVacuumInstrument = Has a SEP vacuum instrument linked to it (Ion Gauge or Solar Wind Spectrometer)

		// T2: the home world's moons
		#sepc.T2.title = Plant a SEP station in <<1>> on <<2>>
		#sepc.T2.genericTitle = A SEP station on one of the home world's moons
		#sepc.T2.description = According to family legend, Albert Kermin's grandfather once left a very similar box on a very similar moon. Nobody remembers what it measured, but the family still talks about the invoice. Time to do it again, properly: land a Central Station and at least one instrument in the <<1>> biome of <<2>>, have a kerbal set everything up and plug the instrument in. A tip from Bill about low gravity: put the station down gently. Things bounce up here, and so do engineers.
		#sepc.T2.genericDescription = Set up a SEP station with an instrument plugged in on one of the home world's moons. Mind the bouncing.
		#sepc.T2.synopsis = Deploy a SEP Central Station with at least one instrument linked to it in <<1>> on <<2>>.
		#sepc.T2.completedMessage = The <<1>> station on <<2>> is blinking away. Albert Kermin has framed the first data packet next to his grandfather's invoice. Jeb wants to know whether it can also measure how high he jumps.
		#sepc.T2.req.haveExperiment = At least one SEP instrument usable on that moon
		#sepc.T2.param.station = Set up a SEP station in <<1>> on <<2>>

		// T3: another planet's world (T3a with air, T3b without)
		#sepc.T3.param.station = Set up a SEP station with two instruments in <<1>> on <<2>>

		#sepc.T3a.title = Forecast the weather in <<1>> on <<2>>
		#sepc.T3a.genericTitle = A SEP weather station on another world
		#sepc.T3a.description = Science has run out of excuses to stay home. AKI wants a weather station on another world, and by "weather" the brochure means whatever happens to fall out of the sky over there: Duna's dust, Eve's soup-thick air or Laythe's sea breeze. Land a Central Station, a Weather Station and at least one more instrument in the <<1>> biome of <<2>>, set them up and plug them in. A note from Mission Control, filed under Eve: landing is the easy part. Getting back is the part the brochure leaves out.
		#sepc.T3a.genericDescription = Set up a SEP station with a Weather Station and one more instrument on Duna, Eve or Laythe.
		#sepc.T3a.synopsis = Deploy a SEP Central Station with a Weather Station and at least one more instrument in <<1>> on <<2>>.
		#sepc.T3a.completedMessage = Weather report from <<1>>, <<2>>: cloudy, with a chance of science. Meanwhile the crews have a nickname for Eve, "Hotel Eve": you can check out any time you like, but you can never leave. They insist it is a coincidence.
		#sepc.T3a.req.haveExperiments = A SEP Weather Station and at least one more SEP instrument usable there
		#sepc.T3a.param.hasWeatherStation = Has a SEP Weather Station linked to it

		#sepc.T3b.title = Listen to the silence in <<1>> on <<2>>
		#sepc.T3b.genericTitle = A SEP station on Ike or Gilly
		#sepc.T3b.description = Some moons don't have weather, they have a view. Ike spends its days staring at Duna, and Gilly spends them trying very hard to stay in one piece. No air also means the vacuum instruments finally get to do their job: the Cold-Cathode Ion Gauge or the Solar Wind Spectrometer, whichever engineering hasn't lost this week. Land a Central Station, one of those and at least one more instrument in the <<1>> biome of <<2>>, set them up and plug them in. On Gilly, do not jump. We mean it. Bob jumped once, and now he is filed under "satellites".
		#sepc.T3b.genericDescription = Set up a SEP station with a vacuum instrument (Ion Gauge or Solar Wind Spectrometer) and one more instrument on Ike or Gilly.
		#sepc.T3b.synopsis = Deploy a SEP Central Station with a vacuum instrument and at least one more instrument in <<1>> on <<2>>.
		#sepc.T3b.completedMessage = The <<1>> station on <<2>> reports a perfect vacuum, which the vacuum instruments find very exciting. Bob would like everyone to know he was recovered and is fine, thanks for asking.
		#sepc.T3b.req.haveExperiments = A SEP vacuum instrument (Ion Gauge or Solar Wind Spectrometer) and at least one more SEP instrument usable there

		// T4: the full package, anywhere airless
		#sepc.T4.title = The full package: three instruments in <<1>> on <<2>>
		#sepc.T4.genericTitle = A full SEP package on an airless world
		#sepc.T4.description = Space is big. Really big. Albert Kermin keeps a faded photo in his office of a station with three instruments standing on a grey, airless plain, and he wants one of his own on every rock that will hold still. Land a Central Station with three instruments, at least one of them a vacuum instrument (the Cold-Cathode Ion Gauge or the Solar Wind Spectrometer), in the <<1>> biome of <<2>>, set them up and plug them all in. The farther the rock, the bigger the cheque. Engineering would like to remind everyone that MOAR instruments still need MOAR cables.
		#sepc.T4.genericDescription = Set up a SEP station with three instruments, at least one of them a vacuum instrument, on any airless world.
		#sepc.T4.synopsis = Deploy a SEP Central Station with three instruments, at least one of them a vacuum instrument, in <<1>> on <<2>>.
		#sepc.T4.completedMessage = Three instruments in <<1>>, <<2>>, all plugged in and all blinking. Albert Kermin hung a new photo next to the old one. Bill reports that everything worked and that, yes, he remembered his towel.
		#sepc.T4.req.tier3 = Have completed an interplanetary SEP station (tier 3)
		#sepc.T4.req.haveExperiments = A SEP vacuum instrument and at least three SEP instruments usable there
		#sepc.T4.param.station = Set up a SEP station with three instruments in <<1>> on <<2>>
		#sepc.T4.param.hasInstruments = Has at least three SEP instruments linked to it

		// Upgrades: go back to an existing station and add one more instrument
		// <<1>> = station (vessel) name, <<2>> = body
		#sepc.U.data.station = A SEP station to upgrade
		#sepc.U.param.station = Upgrade <<1>>

		#sepc.U2.title = Turn <<1>> into a research campus
		#sepc.U2.genericTitle = Add a third instrument to a SEP station on the home world
		#sepc.U2.description = Remember <<1>>, the research facility on <<2>>? Marketing does. They have found a bigger word than "research facility": "research campus", and a campus needs a third instrument. Send a kerbal back to <<1>>, set up one more SEP instrument next to the others and plug it in. Bill asks that whoever goes this time please bring the screwdriver back.
		#sepc.U2.genericDescription = Go back to a two-instrument SEP station on the home world and plug in a third instrument.
		#sepc.U2.synopsis = Add a third SEP instrument to <<1>> and link it to the station.
		#sepc.U2.completedMessage = <<1>> now has three instruments and, according to the new brochure, a campus. The cafeteria is still a cardboard box, but it is a SEP cardboard box.

		#sepc.U3.title = Go back to <<1>> on <<2>>
		#sepc.U3.genericTitle = Add a second instrument to a SEP station on a moon
		#sepc.U3.description = Albert Kermin's grandfather never went back to his box. Albert would like to do better. Return to <<1>> on <<2>>, set up a second SEP instrument and plug it in. A tip from Jeb: a second trip is a great excuse to try landing faster. A tip from Mission Control: please ignore Jeb's tips.
		#sepc.U3.genericDescription = Go back to a one-instrument SEP station on one of the home world's moons and plug in a second instrument.
		#sepc.U3.synopsis = Add a second SEP instrument to <<1>> and link it to the station.
		#sepc.U3.completedMessage = <<1>> is now a two-instrument station. Albert Kermin called his grandmother to tell her. She asked whether the invoice went up too. It did.

		#sepc.U4.title = A return trip to <<1>> on <<2>>
		#sepc.U4.genericTitle = Add a third instrument to a SEP station on another world
		#sepc.U4.description = Getting to <<2>> once was hard. Going back is, according to accounting, "an excellent use of a perfectly good transfer window". Fly back to <<1>>, set up a third SEP instrument and plug it in. The station has been waiting patiently; it has very little else to do.
		#sepc.U4.genericDescription = Go back to a two-instrument SEP station beyond the home system and plug in a third instrument.
		#sepc.U4.synopsis = Add a third SEP instrument to <<1>> and link it to the station.
		#sepc.U4.completedMessage = Three instruments at <<1>>, <<2>>. Somewhere at the KSC, a kerbal is writing a very long expense report about the trip.
	}
}
