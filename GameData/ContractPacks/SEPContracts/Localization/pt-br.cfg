// SEPContracts: textos em português do Brasil.
// <<1>>, <<2>>: valores passados pelo Format() nos cfgs dos contratos (nome do bioma, nome do corpo).

Localization
{
	pt-br
	{
		#sepc.group.name = Surface Experiment Package

		// compartilhados por T0 e T1
		#sepc.data.targetBiome = Bioma alvo
		#sepc.param.hasStation = Tem uma Estação Central SEP
		#sepc.param.onSite = No solo em <<1>>

		// T0: estação de campo
		#sepc.T0.title = Instale uma estação de campo SEP em <<1>>
		#sepc.T0.genericTitle = Instale uma estação de campo SEP em <<1>>
		#sepc.T0.description = A Albert Kermin Industries tem um depósito cheio de Surface Experiment Packages e um departamento de marketing que acabou de aprender a expressão "testado em campo". Antes que alguém amarre um deles numa sonda de pouso da Mun, eles gostariam que o teste fosse em algum lugar com atmosfera, pista de pouso e helicóptero de resgate. Leve voando (ou dirigindo, ou rolando ladeira abaixo) uma Estação Central e pelo menos um instrumento até o bioma <<1>> de <<2>>, faça um kerbal montar tudo no chão e conectar o instrumento à estação. Os dados podem demorar; o kerbal, não. O Bill garante que os plugues "com certeza conectam desta vez".
		#sepc.T0.genericDescription = Monte uma estação SEP com um instrumento conectado, em um dos biomas de <<1>>. Trazer o kerbal de volta não faz parte do contrato, mas é altamente recomendado.
		#sepc.T0.synopsis = Instale uma Estação Central SEP com pelo menos um instrumento conectado a ela em <<1>>.
		#sepc.T0.completedMessage = A estação de <<1>> está de pé e o instrumento já está conversando com ela. O marketing já imprimiu "testado em campo" em tudo, inclusive nas canecas de café. A ciência chega em algumas semanas; as canecas, não.
		#sepc.T0.req.haveExperiment = Pelo menos um instrumento SEP utilizável no planeta natal
		#sepc.T0.param.station = Monte uma estação SEP em <<1>>
		#sepc.T0.param.hasInstrument = Tem pelo menos um instrumento SEP conectado a ela

		// T1: dois instrumentos
		#sepc.T1.title = Amplie a estação SEP de <<1>> para dois instrumentos
		#sepc.T1.genericTitle = Uma estação SEP com dois instrumentos em <<1>>
		#sepc.T1.description = Um instrumento no chão é um experimento científico. Dois instrumentos conectados à mesma Estação Central são, segundo o folheto da AKI, um "centro de pesquisa", e centro de pesquisa rende uma fatura bem mais gorda. Leve uma Estação Central e dois instrumentos SEP diferentes até o bioma <<1>> de <<2>>, monte tudo e conecte os dois. Se já houver uma estação lá, acrescentar um segundo instrumento a ela serve; o folheto não diz nada sobre a ordem.
		#sepc.T1.genericDescription = Monte uma estação SEP em <<1>> com dois instrumentos conectados. O folheto chama isso de centro de pesquisa.
		#sepc.T1.synopsis = Instale uma Estação Central SEP com pelo menos dois instrumentos conectados a ela em <<1>>.
		#sepc.T1.completedMessage = Dois instrumentos em <<1>>, os dois conectados, os dois piscando. A AKI atualizou o folheto e a fatura. Os dados chegam em alguns meses; a fatura vence agora.
		#sepc.T1.req.haveTwoExperiments = Pelo menos dois instrumentos SEP utilizáveis no planeta natal
		#sepc.T1.param.station = Monte uma estação SEP com dois instrumentos em <<1>>
		#sepc.T1.param.hasInstruments = Tem pelo menos dois instrumentos SEP conectados a ela

		// compartilhados por T3 e T4
		#sepc.param.hasVacuumInstrument = Tem um instrumento de vácuo SEP conectado a ela (Medidor de Íons ou Espectrômetro de Vento Solar)

		// T2: as luas do planeta natal
		#sepc.T2.title = Instale uma estação SEP em <<1>>, <<2>>
		#sepc.T2.genericTitle = Uma estação SEP numa das luas do planeta natal
		#sepc.T2.description = Diz a lenda da família que o avô de Albert Kermin deixou, há muito tempo, uma caixa bem parecida numa lua bem parecida. Ninguém lembra o que ela media, mas a família até hoje comenta a fatura. Hora de fazer de novo, e direito: instale uma Estação Central e pelo menos um instrumento no bioma <<1>> de <<2>>, faça um kerbal montar tudo e conectar o instrumento. Dica do Bill sobre gravidade baixa: coloque a estação no chão com carinho. Aqui em cima as coisas quicam, e os engenheiros também.
		#sepc.T2.genericDescription = Monte uma estação SEP com um instrumento conectado numa das luas do planeta natal. Cuidado com os quiques.
		#sepc.T2.synopsis = Instale uma Estação Central SEP com pelo menos um instrumento conectado a ela em <<1>>, <<2>>.
		#sepc.T2.completedMessage = A estação de <<1>>, em <<2>>, está piscando a todo vapor. Albert Kermin emoldurou o primeiro pacote de dados ao lado da fatura do avô. O Jeb quer saber se ela também mede a altura dos pulos dele.
		#sepc.T2.req.haveExperiment = Pelo menos um instrumento SEP utilizável nessa lua
		#sepc.T2.param.station = Monte uma estação SEP em <<1>>, <<2>>

		// T3: um mundo de outro planeta (T3a com ar, T3b sem)
		#sepc.T3.param.station = Monte uma estação SEP com dois instrumentos em <<1>>, <<2>>

		#sepc.T3a.title = Faça a previsão do tempo em <<1>>, <<2>>
		#sepc.T3a.genericTitle = Uma estação meteorológica SEP em outro mundo
		#sepc.T3a.description = A ciência ficou sem desculpas para continuar em casa. A AKI quer uma estação meteorológica em outro mundo, e por "meteorológica" o folheto entende o que quer que caia do céu por lá: a poeira de Duna, o ar grosso feito sopa de Eve ou a brisa do mar de Laythe. Instale uma Estação Central, uma Estação Meteorológica e pelo menos mais um instrumento no bioma <<1>> de <<2>>, monte tudo e conecte. Recado do Controle de Missão, arquivado na pasta "Eve": pousar é a parte fácil. Voltar é a parte que o folheto não menciona.
		#sepc.T3a.genericDescription = Monte uma estação SEP com uma Estação Meteorológica e mais um instrumento em Duna, Eve ou Laythe.
		#sepc.T3a.synopsis = Instale uma Estação Central SEP com uma Estação Meteorológica e pelo menos mais um instrumento em <<1>>, <<2>>.
		#sepc.T3a.completedMessage = Previsão do tempo para <<1>>, <<2>>: nublado, com chance de ciência. Enquanto isso, as tripulações apelidaram Eve de "Hotel Eve": você pode fazer o check-out quando quiser, mas nunca vai conseguir sair. Eles juram que é coincidência.
		#sepc.T3a.req.haveExperiments = Uma Estação Meteorológica SEP e pelo menos mais um instrumento SEP utilizáveis lá
		#sepc.T3a.param.hasWeatherStation = Tem uma Estação Meteorológica SEP conectada a ela

		#sepc.T3b.title = Escute o silêncio em <<1>>, <<2>>
		#sepc.T3b.genericTitle = Uma estação SEP em Ike ou Gilly
		#sepc.T3b.description = Algumas luas não têm clima, têm vista. Ike passa os dias olhando para Duna, e Gilly passa os dias se esforçando para não se desmanchar. Sem ar, os instrumentos de vácuo finalmente podem trabalhar: o Medidor de Íons de Cátodo Frio ou o Espectrômetro de Vento Solar, o que a engenharia não tiver perdido esta semana. Instale uma Estação Central, um deles e pelo menos mais um instrumento no bioma <<1>> de <<2>>, monte tudo e conecte. Em Gilly, não pule. É sério. O Bob pulou uma vez e agora está cadastrado como "satélite".
		#sepc.T3b.genericDescription = Monte uma estação SEP com um instrumento de vácuo (Medidor de Íons ou Espectrômetro de Vento Solar) e mais um instrumento em Ike ou Gilly.
		#sepc.T3b.synopsis = Instale uma Estação Central SEP com um instrumento de vácuo e pelo menos mais um instrumento em <<1>>, <<2>>.
		#sepc.T3b.completedMessage = A estação de <<1>>, em <<2>>, registra vácuo perfeito, o que deixou os instrumentos de vácuo muito animados. O Bob pede para avisar que foi resgatado e está bem, obrigado por perguntar.
		#sepc.T3b.req.haveExperiments = Um instrumento de vácuo SEP (Medidor de Íons ou Espectrômetro de Vento Solar) e pelo menos mais um instrumento SEP utilizáveis lá

		// T4: o pacote completo, em qualquer mundo sem ar
		#sepc.T4.title = O pacote completo: três instrumentos em <<1>>, <<2>>
		#sepc.T4.genericTitle = Um pacote SEP completo num mundo sem ar
		#sepc.T4.description = O espaço é grande. Grande mesmo. Albert Kermin guarda no escritório uma foto desbotada de uma estação com três instrumentos numa planície cinzenta e sem ar, e quer uma igual em cada pedra que fique parada. Instale uma Estação Central com três instrumentos, pelo menos um deles de vácuo (o Medidor de Íons de Cátodo Frio ou o Espectrômetro de Vento Solar), no bioma <<1>> de <<2>>, monte tudo e conecte cada um. Quanto mais longe a pedra, maior o cheque. A engenharia lembra que MAIS instrumentos ainda pedem MAIS cabos.
		#sepc.T4.genericDescription = Monte uma estação SEP com três instrumentos, pelo menos um deles de vácuo, em qualquer mundo sem ar.
		#sepc.T4.synopsis = Instale uma Estação Central SEP com três instrumentos, pelo menos um deles de vácuo, em <<1>>, <<2>>.
		#sepc.T4.completedMessage = Três instrumentos em <<1>>, <<2>>, todos conectados e todos piscando. Albert Kermin pendurou uma foto nova ao lado da antiga. O Bill informa que tudo funcionou e que, sim, ele não esqueceu a toalha.
		#sepc.T4.req.tier3 = Ter concluído uma estação SEP interplanetária (nível 3)
		#sepc.T4.req.haveExperiments = Um instrumento de vácuo SEP e pelo menos três instrumentos SEP utilizáveis lá
		#sepc.T4.param.station = Monte uma estação SEP com três instrumentos em <<1>>, <<2>>
		#sepc.T4.param.hasInstruments = Tem pelo menos três instrumentos SEP conectados a ela

		// Atualizações: voltar a uma estação existente e acrescentar um instrumento
		// <<1>> = nome da estação (nave), <<2>> = corpo celeste
		#sepc.U.data.station = Uma estação SEP para atualizar
		#sepc.U.param.station = Atualize <<1>>

		#sepc.U2.title = Transforme <<1>> num campus de pesquisa
		#sepc.U2.genericTitle = Acrescente um terceiro instrumento a uma estação SEP no planeta natal
		#sepc.U2.description = Lembra de <<1>>, o centro de pesquisa em <<2>>? O marketing lembra. Eles acharam uma palavra maior que "centro de pesquisa": "campus de pesquisa", e campus precisa de um terceiro instrumento. Mande um kerbal de volta a <<1>>, monte mais um instrumento SEP ao lado dos outros e conecte. O Bill pede que, desta vez, quem for traga a chave de fenda de volta.
		#sepc.U2.genericDescription = Volte a uma estação SEP com dois instrumentos no planeta natal e conecte um terceiro.
		#sepc.U2.synopsis = Acrescente um terceiro instrumento SEP a <<1>> e conecte-o à estação.
		#sepc.U2.completedMessage = <<1>> agora tem três instrumentos e, segundo o folheto novo, um campus. O refeitório ainda é uma caixa de papelão, mas é uma caixa de papelão SEP.

		#sepc.U3.title = Volte a <<1>>, em <<2>>
		#sepc.U3.genericTitle = Acrescente um segundo instrumento a uma estação SEP numa lua
		#sepc.U3.description = O avô de Albert Kermin nunca voltou à caixa dele. Albert quer fazer melhor. Volte a <<1>>, em <<2>>, monte um segundo instrumento SEP e conecte. Dica do Jeb: uma segunda viagem é uma ótima desculpa para tentar pousar mais rápido. Dica do Controle de Missão: por favor, ignore as dicas do Jeb.
		#sepc.U3.genericDescription = Volte a uma estação SEP com um instrumento numa das luas do planeta natal e conecte um segundo.
		#sepc.U3.synopsis = Acrescente um segundo instrumento SEP a <<1>> e conecte-o à estação.
		#sepc.U3.completedMessage = <<1>> agora é uma estação com dois instrumentos. Albert Kermin ligou para a avó para contar. Ela perguntou se a fatura também subiu. Subiu.

		#sepc.U4.title = Uma viagem de volta a <<1>>, em <<2>>
		#sepc.U4.genericTitle = Acrescente um terceiro instrumento a uma estação SEP em outro mundo
		#sepc.U4.description = Chegar a <<2>> uma vez já foi difícil. Voltar é, segundo a contabilidade, "um excelente aproveitamento de uma janela de transferência em perfeito estado". Volte a <<1>>, monte um terceiro instrumento SEP e conecte. A estação esperou com paciência; ela não tem muito mais o que fazer.
		#sepc.U4.genericDescription = Volte a uma estação SEP com dois instrumentos fora do sistema do planeta natal e conecte um terceiro.
		#sepc.U4.synopsis = Acrescente um terceiro instrumento SEP a <<1>> e conecte-o à estação.
		#sepc.U4.completedMessage = Três instrumentos em <<1>>, <<2>>. Em algum lugar do CEK, um kerbal está escrevendo um relatório de despesas bem comprido sobre a viagem.
	}
}
