// Tier 4: the full package, anywhere. A Central Station with three instruments,
// at least one of them a vacuum instrument (Ion Gauge or Solar Wind
// Spectrometer), on any airless world with a surface
// other than the home world (planet packs included). A nod to the Apollo Lunar
// Surface Experiments Package that SEP is modelled on.
//
// Offered once either tier-3 contract has been completed, only for bodies the
// player has already landed on. Rewards scale with the body's recovery
// multiplier, the same weight stock contracts use (about 2 for the Mun, 5 for
// Ike, 10 for Eeloo in the stock system). Repeatable, one per biome.

CONTRACT_TYPE
{
	name = SEP_T4_FullPackage
	group = SEPContracts

	title = Format("#sepc.T4.title", [ @/stationBiome.Name(), @targetBody ])
	genericTitle = Format("#sepc.T4.genericTitle", [])
	description = Format("#sepc.T4.description", [ @/stationBiome.Name(), @targetBody ])
	genericDescription = Format("#sepc.T4.genericDescription", [])
	synopsis = Format("#sepc.T4.synopsis", [ @/stationBiome.Name(), @targetBody ])
	completedMessage = Format("#sepc.T4.completedMessage", [ @/stationBiome.Name(), @targetBody ])
	agent = Albert Kermin Industries
	targetBody = AllBodies().Where(cb => !cb.IsHomeWorld() && cb.HasSurface() && !cb.HasAtmosphere() && cb.HaveLandedOn()).Random()
	prestige = Exceptional

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 6.0 * @targetBody.Multiplier()
	rewardReputation = 7.0 * @targetBody.Multiplier()
	rewardFunds = 45000.0 * @targetBody.Multiplier()
	advanceFunds = 13000.0 * @targetBody.Multiplier()
	failureReputation = 3.5 * @targetBody.Multiplier()
	failureFunds = 13000.0 * @targetBody.Multiplier()

	DATA
	{
		type = Biome
		stationBiome = @targetBody.Biomes().Where(b => b.PrimarySituation() != SPLASHED).Random()
		uniquenessCheck = CONTRACT_ALL
		title = Format("#sepc.data.targetBiome", [])
	}

	DATA
	{
		type = List<ScienceExperiment>
		sepBasic = AvailableExperiments(@targetBody).Where(e => e.ID().StartsWith("SEP_") && e.ID().EndsWith("_Basic"))
		requiredValue = false
		hidden = true
	}

	REQUIREMENT
	{
		name = Interplanetary
		type = Any
		title = Format("#sepc.T4.req.tier3", [])
		REQUIREMENT
		{
			name = Atmosphere
			type = CompleteContract
			contractType = SEP_T3_Atmosphere
			minCount = 1
		}
		REQUIREMENT
		{
			name = Airless
			type = CompleteContract
			contractType = SEP_T3_Airless
			minCount = 1
		}
	}
	REQUIREMENT
	{
		name = HaveVacuumInstrument
		type = Expression
		expression = @/sepBasic.Where(e => (e.ID() == "SEP_CCIDscan_Basic" || e.ID() == "SEP_SolarwindSpectrum_Basic")).Count() > 0 && @/sepBasic.Count() >= 3
		title = Format("#sepc.T4.req.haveExperiments", [])
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Format("#sepc.T4.param.station", [ @/stationBiome.Name(), @targetBody ])
		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Format("#sepc.param.hasStation", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasVacuumInstrument
			type = PartValidation
			part = SEP_CCIG
			part = SEP_SWS
			minCount = 1
			title = Format("#sepc.param.hasVacuumInstrument", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasInstruments
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 3
			title = Format("#sepc.T4.param.hasInstruments", [])
			hideChildren = true
		}
		// LANDED or FLYING + radar altitude: see SEP-T0-FieldStation.cfg.
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED, FLYING
			maxTerrainAltitude = 3
			biome = @/stationBiome
			title = Format("#sepc.param.onSite", [ @/stationBiome.Name() ])
			hideChildren = true
		}
	}
}
