// Tier 2: the first SEP station off the home world, on one of its moons (the Mun
// or Minmus in the stock system). Offered once tier 0 has been completed, only
// for moons the player has already landed on, and only while a SEP experiment
// is usable there. Repeatable, one contract per biome.
//
// Same build-not-data rule as tiers 0 and 1. The biome filter drops biomes that
// are mostly water (PrimarySituation), so it also works for planet packs.

CONTRACT_TYPE
{
	name = SEP_T2_MunMinmus
	group = SEPContracts

	title = Format("#sepc.T2.title", [ @/stationBiome.Name(), @targetBody ])
	genericTitle = Format("#sepc.T2.genericTitle", [])
	description = Format("#sepc.T2.description", [ @/stationBiome.Name(), @targetBody ])
	genericDescription = Format("#sepc.T2.genericDescription", [])
	synopsis = Format("#sepc.T2.synopsis", [ @/stationBiome.Name(), @targetBody ])
	completedMessage = Format("#sepc.T2.completedMessage", [ @/stationBiome.Name(), @targetBody ])
	agent = Albert Kermin Industries
	targetBody = HomeWorld().Children().Where(cb => cb.HasSurface() && cb.HaveLandedOn()).Random()
	prestige = Significant

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 8.0
	rewardReputation = 10.0
	rewardFunds = 40000.0
	advanceFunds = 12000.0
	failureReputation = 5.0
	failureFunds = 12000.0

	DATA
	{
		type = Biome
		stationBiome = @targetBody.Biomes().Where(b => b.PrimarySituation() != SPLASHED).Random()
		uniquenessCheck = CONTRACT_ALL
		title = Format("#sepc.data.targetBiome", [])
	}

	DATA
	{
		type = List<ScienceExperiment>
		sepBasic = AvailableExperiments(@targetBody).Where(e => e.ID().StartsWith("SEP_") && e.ID().EndsWith("_Basic"))
		requiredValue = false
		hidden = true
	}

	REQUIREMENT
	{
		name = FirstStation
		type = CompleteContract
		contractType = SEP_T0_FieldStation
		minCount = 1
	}
	REQUIREMENT
	{
		name = HaveExperiment
		type = Expression
		expression = @/sepBasic.Count() > 0
		title = Format("#sepc.T2.req.haveExperiment", [])
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Format("#sepc.T2.param.station", [ @/stationBiome.Name(), @targetBody ])
		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Format("#sepc.param.hasStation", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasInstrument
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 1
			title = Format("#sepc.T0.param.hasInstrument", [])
			hideChildren = true
		}
		// LANDED or FLYING + radar altitude: see SEP-T0-FieldStation.cfg.
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED, FLYING
			maxTerrainAltitude = 3
			biome = @/stationBiome
			title = Format("#sepc.param.onSite", [ @/stationBiome.Name() ])
			hideChildren = true
		}
	}
}
