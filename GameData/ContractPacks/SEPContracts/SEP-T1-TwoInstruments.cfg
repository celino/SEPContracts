// Tier 1: a SEP station with at least two instruments linked to it, in a biome
// of the home world. Offered once tier 0 has been completed and two SEP
// experiments are usable there. Repeatable, one contract per biome.
//
// Like tier 0 this is about the build, not the data (SEP runs take 75-100
// days). Expanding the tier-0 station counts if the biome matches: the
// instrument count is checked on the vessel, and with the KAS 1.x plug every
// linked instrument is part of the station's vessel.
//
// PartValidation counts parts with ModuleSEPScienceExperiment, so two copies of
// the same instrument would pass too; there is no cheap way in CC to map an
// experiment id to its part (SEP_Retroreflector lives in SEP_LRRR), so the
// texts ask for two different ones and the check settles for two.

CONTRACT_TYPE
{
	name = SEP_T1_TwoInstruments
	group = SEPContracts

	title = Expand the SEP station in @/stationBiome.Name() to two instruments
	genericTitle = A two-instrument SEP station on @targetBody
	description = One instrument on the ground is a science experiment. Two instruments plugged into the same Central Station is, according to the AKI brochure, a "research facility", and research facilities bill at a much better rate. Get a Central Station and two different SEP instruments into the @/stationBiome.Name() biome of @targetBody, set them up and plug both in. If there is already a station there, adding a second instrument to it is fine; the brochure does not say anything about the order.
	genericDescription = Set up a SEP station on @targetBody with two instruments plugged in. The brochure calls that a research facility.
	synopsis = Deploy a SEP Central Station with at least two instruments linked to it in @/stationBiome.Name().
	completedMessage = Two instruments in @/stationBiome.Name(), both plugged in, both blinking. AKI has updated the brochure and the invoice. The data is due in a couple of months; the invoice is due now.

	agent = Albert Kermin Industries
	targetBody = HomeWorld()
	prestige = Significant

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 5.0
	rewardReputation = 6.0
	rewardFunds = 22000.0
	advanceFunds = 7000.0
	failureReputation = 3.0
	failureFunds = 7000.0

	DATA
	{
		type = Biome
		stationBiome = @targetBody.Biomes().Where(b => !b.IsKSC() && b.Name() != "Water").Random()
		uniquenessCheck = CONTRACT_ALL
		title = Target biome
	}

	DATA
	{
		type = List<ScienceExperiment>
		sepBasic = AvailableExperiments(@targetBody).Where(e => e.ID().StartsWith("SEP_") && e.ID().EndsWith("_Basic"))
		requiredValue = false
		hidden = true
	}

	REQUIREMENT
	{
		name = FirstStation
		type = CompleteContract
		contractType = SEP_T0_FieldStation
		minCount = 1
	}
	REQUIREMENT
	{
		name = HaveTwoExperiments
		type = Expression
		expression = @/sepBasic.Count() >= 2
		title = At least two SEP instruments usable on the home world
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Set up a SEP station with two instruments in @/stationBiome.Name()

		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Has a SEP Central Station
		}
		PARAMETER
		{
			name = HasInstruments
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 2
			title = Has at least two SEP instruments linked to it
		}
		// LANDED or FLYING + radar altitude: see SEP-T0-FieldStation.cfg.
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED, FLYING
			maxTerrainAltitude = 3
			biome = @/stationBiome
			title = On the ground in @/stationBiome.Name()
			hideChildren = true
		}
	}
}
