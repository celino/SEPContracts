// Contract Configurator 2.13.4 and older ship SEP experiment definitions from 2016
// (SEP_PSE, ...), so no SEP experiment is ever "available" to a contract. The updated
// definitions are merged in KSP-RO/ContractConfigurator#78 and #79, but not released yet.
// Until then, this replaces the old definitions with those from CC's master branch.
// The HAS only matches the old file (SEP_Retroreflector without a level), so on a CC
// that already ships the new definitions this patch does nothing.
// Remove this file once a CC release with #78 and #79 is the minimum version.

@CC_EXPERIMENT_DEFINITIONS[SurfaceExperimentPackage]:HAS[@EXPERIMENT[SEP_Retroreflector]]:FOR[SEPContracts]
{
    !EXPERIMENT,* {}

    EXPERIMENT
    {
        name = SEP_GolfTest
    }

    EXPERIMENT
    {
        name = SEP_Retroreflector_Basic
        part = SEP.LRRR
    }

    EXPERIMENT
    {
        name = SEP_Retroreflector_Detailed
        part = SEP.LRRR
    }

    EXPERIMENT
    {
        name = SEP_Retroreflector_Exhaustive
        part = SEP.LRRR
    }

    EXPERIMENT
    {
        name = SEP_InteriorHeatScan_Basic
        part = SEP.IHP
    }

    EXPERIMENT
    {
        name = SEP_InteriorHeatScan_Detailed
        part = SEP.IHP
    }

    EXPERIMENT
    {
        name = SEP_InteriorHeatScan_Exhaustive
        part = SEP.IHP
    }

    EXPERIMENT
    {
        name = SEP_CCIDscan_Basic
        part = SEP.CCIG
        requireNoAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_CCIDscan_Detailed
        part = SEP.CCIG
        requireNoAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_CCIDscan_Exhaustive
        part = SEP.CCIG
        requireNoAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_SolarwindSpectrum_Basic
        part = SEP.SWS
        requireNoAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_SolarwindSpectrum_Detailed
        part = SEP.SWS
        requireNoAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_SolarwindSpectrum_Exhaustive
        part = SEP.SWS
        requireNoAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_WeatherScan_Basic
        part = SEP.WME
        requireAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_WeatherScan_Detailed
        part = SEP.WME
        requireAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_WeatherScan_Exhaustive
        part = SEP.WME
        requireAtmosphere = true
    }

    EXPERIMENT
    {
        name = SEP_PSE_Basic
        part = SEP.PSE
    }

    EXPERIMENT
    {
        name = SEP_PSE_Detailed
        part = SEP.PSE
    }

    EXPERIMENT
    {
        name = SEP_PSE_Exhaustive
        part = SEP.PSE
    }

    EXPERIMENT
    {
        name = SEP_MagnetScan_Basic
        part = SEP.MAG
    }

    EXPERIMENT
    {
        name = SEP_MagnetScan_Detailed
        part = SEP.MAG
    }

    EXPERIMENT
    {
        name = SEP_MagnetScan_Exhaustive
        part = SEP.MAG
    }

    EXPERIMENT
    {
        name = SEP_GravityScan_Basic
        part = SEP.GRAV
    }

    EXPERIMENT
    {
        name = SEP_GravityScan_Detailed
        part = SEP.GRAV
    }

    EXPERIMENT
    {
        name = SEP_GravityScan_Exhaustive
        part = SEP.GRAV
    }
}
