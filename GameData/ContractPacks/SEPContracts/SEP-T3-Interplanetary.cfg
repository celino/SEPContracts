// Tier 3: a two-instrument SEP station on another planet's world, split in two
// contract types because SEP instruments care about the air:
//   - SEP_T3_Atmosphere: Duna, Eve or Laythe, with the Weather Station (SEP_WME,
//     atmosphere only).
//   - SEP_T3_Airless: Ike or Gilly, with a vacuum instrument: the Cold-Cathode
//     Ion Gauge (SEP_CCIG) or the Solar Wind Spectrometer (SEP_SWS), both
//     no-atmosphere only.
// The bodies are picked by internal name, so in a planet pack without them these
// contracts are simply never offered. Offered once tier 2 has been completed,
// only for bodies the player has already landed on. Repeatable, one per biome.

CONTRACT_TYPE
{
	name = SEP_T3_Atmosphere
	group = SEPContracts

	title = Format("#sepc.T3a.title", [ @/stationBiome.Name(), @targetBody ])
	genericTitle = Format("#sepc.T3a.genericTitle", [])
	description = Format("#sepc.T3a.description", [ @/stationBiome.Name(), @targetBody ])
	genericDescription = Format("#sepc.T3a.genericDescription", [])
	synopsis = Format("#sepc.T3a.synopsis", [ @/stationBiome.Name(), @targetBody ])
	completedMessage = Format("#sepc.T3a.completedMessage", [ @/stationBiome.Name(), @targetBody ])
	agent = Albert Kermin Industries
	targetBody = AllBodies().Where(cb => (cb.Name() == "Duna" || cb.Name() == "Eve" || cb.Name() == "Laythe") && cb.HaveLandedOn()).Random()
	prestige = Exceptional

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 15.0
	rewardReputation = 18.0
	rewardFunds = 90000.0
	advanceFunds = 25000.0
	failureReputation = 9.0
	failureFunds = 25000.0

	DATA
	{
		type = Biome
		stationBiome = @targetBody.Biomes().Where(b => b.PrimarySituation() != SPLASHED).Random()
		uniquenessCheck = CONTRACT_ALL
		title = Format("#sepc.data.targetBiome", [])
	}

	DATA
	{
		type = List<ScienceExperiment>
		sepBasic = AvailableExperiments(@targetBody).Where(e => e.ID().StartsWith("SEP_") && e.ID().EndsWith("_Basic"))
		requiredValue = false
		hidden = true
	}

	REQUIREMENT
	{
		name = OffWorld
		type = CompleteContract
		contractType = SEP_T2_MunMinmus
		minCount = 1
	}
	REQUIREMENT
	{
		name = HaveWeatherStation
		type = Expression
		expression = @/sepBasic.Where(e => e.ID() == "SEP_WeatherScan_Basic").Count() > 0 && @/sepBasic.Count() >= 2
		title = Format("#sepc.T3a.req.haveExperiments", [])
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Format("#sepc.T3.param.station", [ @/stationBiome.Name(), @targetBody ])
		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Format("#sepc.param.hasStation", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasWeatherStation
			type = PartValidation
			part = SEP_WME
			minCount = 1
			title = Format("#sepc.T3a.param.hasWeatherStation", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasInstruments
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 2
			title = Format("#sepc.T1.param.hasInstruments", [])
			hideChildren = true
		}
		// LANDED or FLYING + radar altitude: see SEP-T0-FieldStation.cfg.
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED, FLYING
			maxTerrainAltitude = 3
			biome = @/stationBiome
			title = Format("#sepc.param.onSite", [ @/stationBiome.Name() ])
			hideChildren = true
		}
	}
}

CONTRACT_TYPE
{
	name = SEP_T3_Airless
	group = SEPContracts

	title = Format("#sepc.T3b.title", [ @/stationBiome.Name(), @targetBody ])
	genericTitle = Format("#sepc.T3b.genericTitle", [])
	description = Format("#sepc.T3b.description", [ @/stationBiome.Name(), @targetBody ])
	genericDescription = Format("#sepc.T3b.genericDescription", [])
	synopsis = Format("#sepc.T3b.synopsis", [ @/stationBiome.Name(), @targetBody ])
	completedMessage = Format("#sepc.T3b.completedMessage", [ @/stationBiome.Name(), @targetBody ])
	agent = Albert Kermin Industries
	targetBody = AllBodies().Where(cb => (cb.Name() == "Ike" || cb.Name() == "Gilly") && cb.HaveLandedOn()).Random()
	prestige = Exceptional

	cancellable = true
	declinable = true
	maxCompletions = 0
	maxSimultaneous = 1

	rewardScience = 15.0
	rewardReputation = 18.0
	rewardFunds = 90000.0
	advanceFunds = 25000.0
	failureReputation = 9.0
	failureFunds = 25000.0

	DATA
	{
		type = Biome
		stationBiome = @targetBody.Biomes().Where(b => b.PrimarySituation() != SPLASHED).Random()
		uniquenessCheck = CONTRACT_ALL
