		name = HaveVacuumInstrument
		type = Expression
		expression = @/sepBasic.Where(e => (e.ID() == "SEP_CCIDscan_Basic" || e.ID() == "SEP_SolarwindSpectrum_Basic")).Count() > 0 && @/sepBasic.Count() >= 2
		title = Format("#sepc.T3b.req.haveExperiments", [])
	}

	PARAMETER
	{
		name = Station
		type = VesselParameterGroup
		title = Format("#sepc.T3.param.station", [ @/stationBiome.Name(), @targetBody ])
		PARAMETER
		{
			name = HasStation
			type = PartValidation
			part = SEP_CentralStation
			minCount = 1
			title = Format("#sepc.param.hasStation", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasVacuumInstrument
			type = PartValidation
			part = SEP_CCIG
			part = SEP_SWS
			minCount = 1
			title = Format("#sepc.param.hasVacuumInstrument", [])
			hideChildren = true
		}
		PARAMETER
		{
			name = HasInstruments
			type = PartValidation
			partModule = ModuleSEPScienceExperiment
			minCount = 2
			title = Format("#sepc.T1.param.hasInstruments", [])
