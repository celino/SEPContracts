		// LANDED or FLYING + radar altitude: see SEP-T0-FieldStation.cfg.
		PARAMETER
		{
			name = OnSite
			type = ReachState
			situation = LANDED, FLYING
			maxTerrainAltitude = 3
			biome = @/stationBiome
